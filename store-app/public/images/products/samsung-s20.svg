<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="galaxyGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c0392b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#galaxyGrad3)"/>
  
  <!-- Phone body -->
  <rect x="120" y="60" width="160" height="280" rx="20" ry="20" fill="#34495e" stroke="#e74c3c" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="130" y="80" width="140" height="240" rx="12" ry="12" fill="#000" opacity="0.8"/>
  
  <!-- Screen glow -->
  <rect x="135" y="85" width="130" height="230" rx="10" ry="10" fill="#e74c3c" opacity="0.3"/>
  
  <!-- Camera module -->
  <rect x="145" y="95" width="35" height="35" rx="6" ry="6" fill="#3498db" opacity="0.8"/>
  <circle cx="155" cy="105" r="6" fill="#2c3e50"/>
  <circle cx="170" cy="105" r="6" fill="#2c3e50"/>
  <circle cx="162" cy="120" r="6" fill="#2c3e50"/>
  
  <!-- Samsung logo area -->
  <text x="200" y="300" text-anchor="middle" fill="#3498db" font-family="Arial, sans-serif" font-size="14" font-weight="bold">SAMSUNG</text>
  
  <!-- S20 text -->
  <text x="200" y="370" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Galaxy S20</text>
</svg>
